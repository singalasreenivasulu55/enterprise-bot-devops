apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: enterprise-bot 
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: enterprise-bot 
  template:
    metadata:
      labels:
        app: enterprise-bot
    spec:
      containers:
        - name: enterprise-bot
          image: enterprise-bot-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080 
          env:
            - name: APP_NAME
              value: "enterprise-bot"
            - name: VERSION
              value: "1.0.0"
                